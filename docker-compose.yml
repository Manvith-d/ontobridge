# Two services over one store: the pipeline writes runs, reviews and audit entries; the catalog reads them.
services:
  pipeline:
    build: .
    ports: ["8000:8000"]
    volumes: [runtime:/app/runtime]
    environment:
      ONTOBRIDGE_LLM: ${ONTOBRIDGE_LLM:-none}  # e.g. ollama:llama3.1 with OLLAMA_HOST set
  catalog:
    build: .
    command: ["uvicorn", "ontobridge.services.catalog_api:app", "--host", "0.0.0.0", "--port", "8001"]
    ports: ["8001:8001"]
    volumes: [runtime:/app/runtime]

volumes:
  runtime:
