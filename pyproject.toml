[project]
name = "ontobridge"
version = "0.1.0"
description = "Agentic semantic data platform: LangGraph agents align messy CSV/JSON sources to RDF/OWL ontologies, mine reusable dimensions, and generate Fabric Lakehouse star schemas with full provenance."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Manvith Reddy Dalli" }]
requires-python = ">=3.11"
dependencies = [
  "langgraph==1.2.14",
  "langchain-core==1.6.7",
  "rdflib==7.6.0",
  "rapidfuzz==3.14.6",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
spark = ["pyspark==4.2.0"]
ollama = ["langchain-ollama==1.1.0"]
anthropic = ["langchain-anthropic==1.7.5"]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]

[project.scripts]
ontobridge = "ontobridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ontobridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["spark: runs generated Spark SQL on a local Spark session (needs Java 17+)"]

[tool.ruff]
line-length = 110
target-version = "py311"
