name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4  # Spark runs the generated SQL in the spark-marked test
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev,spark]"
      - run: ruff check .
      - run: pytest -q
      - name: Alignment quality gate (fails if a wrong mapping is auto-accepted on held-out names)
        run: ontobridge eval --json eval.json
      - name: Generated SQL is up to date
        run: |
          ontobridge align > /dev/null
          ontobridge model --target fabric --out /tmp/fabric > /dev/null
          for f in finance healthcare insurance retail; do
            diff <(grep -v '^-- Generated from' fabric/$f.sql) <(grep -v '^-- Generated from' /tmp/fabric/$f.sql)
          done

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ontobridge .
      - run: |
          docker run -d -p 8000:8000 --name ob ontobridge
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs ob; exit 1
